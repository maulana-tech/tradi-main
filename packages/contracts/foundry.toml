[profile.default]
src = "src"
out = "out"
libs = ["lib", "../../node_modules", "node_modules"]
test = "test"
script = "script"
solc_version = "0.8.35"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./" }]

# Invariant tuning: every action in fork-mode invariants hits the real Nox
# precompile (validateInputProof + downstream ops) which is RPC-bound. Default
# 256 runs × 500 depth would mean tens of thousands of RPC calls.
[profile.default.invariant]
runs = 32
depth = 20
fail_on_revert = false
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@iexec-nox/=../../node_modules/@iexec-nox/",
    "@openzeppelin/contracts/=../../node_modules/@openzeppelin/contracts/",
    "@openzeppelin/contracts-upgradeable/=../../node_modules/@openzeppelin/contracts-upgradeable/",
    "encrypted-types/=../../node_modules/encrypted-types/"
]

[profile.ci]
verbosity = 4

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"

[rpc_endpoints]
ethereum_sepolia = "${ETH_SEPOLIA_RPC_URL}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"

[etherscan]
ethereum_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.etherscan.io/api" }
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", url = "https://api-sepolia.arbiscan.io/api" }
